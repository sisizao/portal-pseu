<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview Responsivo | Portal PSEU</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: rgba(14, 13, 12, 0.86);
      --panel-strong: rgba(7, 7, 8, 0.92);
      --gold: #d7ad62;
      --line: rgba(215, 173, 98, 0.2);
      --line-strong: rgba(215, 173, 98, 0.38);
      --text: #f4eee2;
      --muted: rgba(244, 238, 226, 0.64);
      --shadow: rgba(0, 0, 0, 0.55);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(215, 173, 98, 0.13), transparent 22rem),
        radial-gradient(circle at 82% 24%, rgba(61, 111, 120, 0.16), transparent 26rem),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 96px),
        linear-gradient(135deg, #040404, #090806 48%, #020607);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 42px, rgba(215, 173, 98, 0.025) 42px 43px, transparent 43px 86px),
        radial-gradient(circle at 50% 38%, transparent 0 18rem, rgba(0, 0, 0, 0.52) 44rem);
      opacity: 0.55;
    }

    .shell {
      min-height: 100vh;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      padding: clamp(16px, 3vw, 28px);
    }

    .toolbar {
      width: min(1180px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(215, 173, 98, 0.07), transparent 48%, rgba(61, 111, 120, 0.05)),
        var(--panel);
      box-shadow:
        0 22px 54px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }

    .brand {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .brand span {
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .brand strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 2vw, 1.55rem);
      font-weight: 700;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    button,
    select {
      min-height: 40px;
      border: 1px solid rgba(215, 173, 98, 0.24);
      color: var(--text);
      background: rgba(0, 0, 0, 0.35);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    button {
      padding: 0 13px;
      letter-spacing: 0.06em;
    }

    button:hover,
    button:focus-visible,
    select:hover,
    select:focus-visible {
      border-color: rgba(255, 226, 154, 0.82);
      outline: none;
    }

    button.is-active {
      color: #fff7de;
      border-color: rgba(244, 205, 127, 0.72);
      background:
        linear-gradient(90deg, rgba(90, 59, 22, 0.92), rgba(162, 115, 43, 0.82)),
        rgba(215, 173, 98, 0.18);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    select {
      width: 190px;
      padding: 0 12px;
    }

    .stage-wrap {
      min-width: 0;
      display: grid;
      place-items: start center;
      overflow: auto;
      padding: 8px 0 32px;
    }

    .stage {
      width: min(var(--preview-width), calc(100vw - 36px));
      transition: width 0.26s ease;
      display: grid;
      gap: 10px;
    }

    .device-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .device {
      position: relative;
      border: 1px solid var(--line-strong);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%),
        var(--panel-strong);
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.62),
        0 0 0 8px rgba(0, 0, 0, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: var(--device-padding);
      overflow: hidden;
    }

    .device::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: var(--notch-width);
      height: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(215, 173, 98, 0.34);
      box-shadow: 0 0 18px rgba(215, 173, 98, 0.08);
      pointer-events: none;
      opacity: var(--notch-opacity);
    }

    iframe {
      display: block;
      width: 100%;
      height: var(--preview-height);
      border: 1px solid rgba(215, 173, 98, 0.16);
      background: #050506;
      transition: height 0.26s ease;
    }

    .hint {
      width: min(1180px, 100%);
      margin: 0 auto;
      color: rgba(244, 238, 226, 0.48);
      font-size: 0.78rem;
      text-align: center;
    }

    body[data-device="desktop"] {
      --preview-width: 1440px;
      --preview-height: 900px;
      --device-padding: 14px;
      --notch-width: 120px;
      --notch-opacity: 0;
    }

    body[data-device="tablet"] {
      --preview-width: 768px;
      --preview-height: 1024px;
      --device-padding: 18px 14px 20px;
      --notch-width: 92px;
      --notch-opacity: 0.7;
    }

    body[data-device="mobile"] {
      --preview-width: 390px;
      --preview-height: 844px;
      --device-padding: 20px 10px 22px;
      --notch-width: 78px;
      --notch-opacity: 0.85;
    }

    body[data-device="tablet"] .device,
    body[data-device="mobile"] .device {
      border-radius: 28px;
    }

    body[data-device="mobile"] .device {
      border-radius: 34px;
    }

    @media (max-width: 820px) {
      .toolbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .control-group {
        justify-content: flex-start;
      }

      select {
        width: 100%;
      }

      .device-meta {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body data-device="desktop">
  <main class="shell">
    <section class="toolbar" aria-label="Controles do preview responsivo">
      <div class="brand">
        <span>Centro de Operacoes</span>
        <strong>Preview responsivo PSEU</strong>
      </div>

      <div class="control-group" aria-label="Tamanho do dispositivo">
        <button class="is-active" type="button" data-device="desktop">Desktop</button>
        <button type="button" data-device="tablet">Tablet</button>
        <button type="button" data-device="mobile">Mobile</button>
      </div>

      <label>
        <select data-page aria-label="Selecionar pagina">
          <option value="../index.html">funil principal</option>
          <option value="index.html">PCL/index.html</option>
          <option value="biblioteca.html">PCL/biblioteca.html</option>
          <option value="dashboard.html">PCL/dashboard.html</option>
          <option value="leitor.html">PCL/leitor.html</option>
        </select>
      </label>
    </section>

    <section class="stage-wrap" aria-label="Area de visualizacao">
      <div class="stage">
        <div class="device-meta">
          <span data-device-label>Desktop - 1440px</span>
          <span data-page-label>funil principal</span>
        </div>
        <div class="device">
          <iframe data-preview src="../index.html" title="Preview do Portal PSEU"></iframe>
        </div>
      </div>
    </section>

    <p class="hint">Use os controles acima para alternar entre Desktop, Tablet/iPad e Mobile/iPhone.</p>
  </main>

  <script>
    const deviceButtons = document.querySelectorAll("[data-device]");
    const pageSelect = document.querySelector("[data-page]");
    const preview = document.querySelector("[data-preview]");
    const deviceLabel = document.querySelector("[data-device-label]");
    const pageLabel = document.querySelector("[data-page-label]");

    const devices = {
      desktop: "Desktop - 1440px",
      tablet: "Tablet/iPad - 768px",
      mobile: "Mobile/iPhone - 390px",
    };

    function setDevice(device) {
      document.body.dataset.device = device;
      deviceButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.device === device);
      });
      deviceLabel.textContent = devices[device] || devices.desktop;
    }

    function setPage(page) {
      preview.src = page;
      pageLabel.textContent = pageSelect.options[pageSelect.selectedIndex]?.textContent || page;
    }

    deviceButtons.forEach((button) => {
      button.addEventListener("click", () => setDevice(button.dataset.device));
    });

    pageSelect.addEventListener("change", () => setPage(pageSelect.value));
  </script>
</body>
</html>
